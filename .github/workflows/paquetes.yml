name: Xerar e publicar os paquetes de instalación

# Executa crear-paquetes.sh nos servidores de GitHub (non depende de
# Dropbox nin de ningún ordenador persoal) e publica os tres zips coma
# "Release" descargable -- ligazón estable, sen límite de tamaño nin de
# cota persoal.
#
# Dispárase: (a) ao crear unha etiqueta "vX.Y.Z" (release oficial), ou
# (b) á man dende a pestana "Actions" de GitHub ("Run workflow").

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de construción (binutils, python3-pip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils python3-pip zip unzip

      - name: Instalar macholib (para resolver dependencias de macOS)
        run: pip install --quiet --break-system-packages macholib

      - name: Xerar os tres paquetes
        run: ./instalador/crear-paquetes.sh

      - name: Nome da release (etiqueta ou execución manual)
        id: nome
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "etiqueta=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "etiqueta=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar coma Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nome.outputs.etiqueta }}
          name: Anonimizador ${{ steps.nome.outputs.etiqueta }}
          files: |
            anonimizador-xuridico-instalacion-windows.zip
            anonimizador-xuridico-instalacion-mac.zip
            anonimizador-xuridico-instalacion-linux.zip
          generate_release_notes: true
